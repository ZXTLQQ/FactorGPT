<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FactorGPT 因子研究报告</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; background: #0f1420; color: #e6e9ef; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px; }
  h1 { font-size: 24px; border-left: 4px solid #4f9cf9; padding-left: 12px; }
  h2 { font-size: 18px; margin-top: 32px; color: #9fc4ff; }
  .card { background: #18202f; border: 1px solid #27324a; border-radius: 10px; padding: 16px 20px; margin: 12px 0; }
  .meta { color: #8b97ad; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { border: 1px solid #27324a; padding: 8px 10px; text-align: left; }
  th { background: #1f2a3d; }
  .plot { width: 100%; height: 420px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>FactorGPT 因子研究报告</h1>
  <div class="meta" id="meta">分析日期：__DATE__ ｜ 数据源：NeoData（平台稳定源）</div>

  <div class="card">
    <h2>因子概览</h2>
    <table id="factor-table"><thead><tr><th>指标</th><th>数值</th></tr></thead><tbody></tbody></table>
  </div>

  <div class="card">
    <h2>IC 序列</h2>
    <div id="ic-plot" class="plot"></div>
  </div>

  <div class="card">
    <h2>分组累积收益</h2>
    <div id="quantile-plot" class="plot"></div>
  </div>

  <div class="card">
    <h2>多空组合净值</h2>
    <div id="longshort-plot" class="plot"></div>
  </div>
</div>

<script>
// 由 FactorGPT 回测层注入数据；此处为占位，真实报告由 Python 端写回 JSON。
const REPORT = __REPORT_JSON__;
function render() {
  document.getElementById("meta").textContent =
    "分析日期：" + (REPORT.date || "") + " ｜ 数据源：NeoData（平台稳定源）";
  const tb = document.querySelector("#factor-table tbody");
  (REPORT.metrics || []).forEach(([k, v]) => {
    const tr = document.createElement("tr");
    tr.innerHTML = "<td>" + k + "</td><td>" + v + "</td>";
    tb.appendChild(tr);
  });
  if (REPORT.ic) Plotly.newPlot("ic-plot", [{ x: REPORT.dates, y: REPORT.ic, type: "scatter", name: "IC" }], {paper_bgcolor:"#18202f", plot_bgcolor:"#18202f", font:{color:"#e6e9ef"}});
  if (REPORT.quantile) Plotly.newPlot("quantile-plot", REPORT.quantile, {paper_bgcolor:"#18202f", plot_bgcolor:"#18202f", font:{color:"#e6e9ef"}});
  if (REPORT.longshort) Plotly.newPlot("longshort-plot", REPORT.longshort, {paper_bgcolor:"#18202f", plot_bgcolor:"#18202f", font:{color:"#e6e9ef"}});
}
render();
</script>
</body>
</html>
