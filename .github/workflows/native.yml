name: Native kernels

# 单独一个 workflow，而不是塞进 ci.yml：主 CI 必须在"没有编译器的机器"上也能绿
# （那是绝大多数用户的情形），这里则相反——必须在"有编译器的机器"上证明 C++ 与
# pandas 逐位一致。两条信号不能合并，否则一边坏会把另一边也拖下水。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu 用 gcc（ABI 与 CPython 一致），windows 用 MSVC（windows-latest 自带）
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy pytest pytest-timeout pybind11 setuptools wheel

      - name: Toolchain diagnostics (informational)
        # 这一条**故意不参与成败判定**：它的作用是当"Verify backend"变红时，日志里
        # 已经写明这台机器到底有什么编译器，省掉一轮"再加个 print 重跑"的往返。
        # 用脚本而不是 heredoc：Windows runner 的默认 shell 是 pwsh，不支持 <<PY。
        continue-on-error: true
        run: python scripts/native_diag.py

      - name: Build extension in place
        # 只用 --python：产物由 setuptools 自己找工具链（不需要 cl 在 PATH 上）。
        # 不要顺手加 --dll——那条路要求 PATH 里能找到编译器，Windows runner 默认没有。
        run: python scripts/build_native.py --python

      - name: Report why the backend is what it is (informational)
        continue-on-error: true
        run: python scripts/native_diag.py

      - name: Verify backend is native
        # 硬门禁：这一步红了，说明"C++ 加速"这条能力事实上不存在（可能是没编出来、
        # 也可能编出来了但 import 失败被静默降级到 pandas）。
        run: python -c "import sys; sys.path.insert(0,'src'); import mining.native_kernels as NK; b=NK.backend(); print('backend =', b); sys.exit(0 if b.startswith('pybind11') else 1)"

      - name: Parity tests (native vs pandas)
        # FG_REQUIRE_NATIVE=1 把"没有原生库就跳过"变成失败：
        # 编译产物某天不再生成的话，必须由这里发现
        env:
          FG_REQUIRE_NATIVE: "1"
        run: python -m pytest tests/test_native_kernels.py tests/test_csreg.py tests/test_mining.py -q

      - name: Fallback path still works
        # 兜底路径也必须绿：永远要有"关掉原生还能用"这条路
        env:
          FG_DISABLE_NATIVE: "1"
        run: python -m pytest tests/test_native_kernels.py tests/test_mining.py -q
