name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn pyarrow pyyaml jieba statsmodels pytest pytest-timeout
          # alphalens-reloaded：供 test_backtest.py 的交叉校验测试使用
          # （alphalens.reformed 为有效签名研究提供第三方交叉印证）
          pip install alphalens-reloaded

      - name: Lint (ruff)
        # 规则集见仓库根目录 ruff.toml（渐进式放开，当前只阻断新增的高价值问题）
        # 锁定大版本：规则的增删改会随 ruff 版本漂移，避免 CI 因升级意外转红
        run: |
          pip install "ruff==0.16.*"
          ruff check src scripts tests --output-format=github

      - name: Run test suite
        # 不设 --maxfail，让所有失败都可见（避免早期失败掩盖后续缺陷）
        # 日志 tee 到文件：默认 pytest 会为每个失败打印完整 traceback，几十个失败
        # 就是几百行，真正的原因被淹在里面。下面那一步只把 FAILED 清单挑出来。
        run: |
          set -o pipefail
          python -m pytest tests/ -q --timeout=180 2>&1 | tee pytest.log

      - name: 失败用例清单
        if: failure()
        run: |
          {
            echo "### 失败用例清单"
            echo
            grep -E "^(FAILED|ERROR)" pytest.log || echo "（日志里没有 FAILED/ERROR 行，可能是前面的步骤失败）"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compile-check all source modules
        run: |
          python -m compileall -q src scripts factorgpt-skill third_party demo_sim.py run_agent.py
