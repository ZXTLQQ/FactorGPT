# FactorGPT 配置文件
llm:
  # 模型提供方: deepseek / openai / qwen / ollama / vllm 等任意 OpenAI 兼容端点
  # 切换到本地 Ollama 时: provider=ollama, model=<ollama 中的模型名>,
  #   base_url=http://localhost:11434/v1, api_key=ollama(占位, Ollama 不校验)
  provider: deepseek               # deepseek / openai / qwen / ollama
  api_key: "${DEEPSEEK_API_KEY}"   # 密钥存于 .env(已 gitignore), 避免明文入库
  model: deepseek-chat             # DeepSeek 官方对话模型
  base_url: "https://api.deepseek.com"   # 官方 OpenAI 兼容端点(不带 /v1, 文档推荐)
  temperature: 0.3
  # 若设为 true，则允许用环境变量覆盖以下字段(便于不落盘密钥/快速切后端):
  #   FACTORGPT_LLM_BASE_URL / FACTORGPT_LLM_API_KEY / FACTORGPT_LLM_MODEL / FACTORGPT_LLM_PROVIDER
  use_env_override: false

  # 多 LLM 路由（可选，默认关闭）：draft 小模型海选 + critic 强模型精炼。
  # 启用后，FactorAgentNodes 自动把 self.llm 切换为路由层，调用处无需改动。
  # 典型组合：draft 用本地 Ollama 小模型（低成本高吞吐），critic 用云端强模型（保证质量）。
  router:
    enabled: false
    draft:                       # 小模型：快速海选候选因子
      provider: ollama
      model: qwen2.5-coder:7b
      base_url: "http://localhost:11434/v1"
      api_key: "ollama"
      temperature: 0.5
    critic:                      # 强模型：评估并精炼成最终代码
      provider: deepseek
      model: deepseek-chat
      api_key: "${DEEPSEEK_API_KEY}"
      temperature: 0.3

# ============ JEV 结构化决策模型（TypeSafe "System One"）============
# JEV 不写长文、只做「判断题」：输入非结构化内容 + 一组问题，返回类型化判定与
# 校准概率（端到端 70~500ms）。这里用它把用户上传的图片/文本/PDF 压成可落库的
# 结构化标签（数据类型 / 情绪极性 / 是否含前瞻信息 / 能否对齐到标的-时间 /
# 建议的因子化路径），再交给挖掘流水线，避免把整篇原文塞进 prompt。
# 未配置 TYPESAFE_API_KEY 时自动降级为本地规则判定，永不阻塞挖掘。
jev:
  enabled: true
  base_url: "https://api.typesafe.ai/v1/systemone"
  api_key_env: "TYPESAFE_API_KEY"   # 写在 .env（已 gitignore）
  model: "jev-latest"
  timeout: 15.0                     # 单次调用超时（秒）
  max_chars: 6000                   # 送给 JEV 的内容字符上限（超出截断）
  fallback_to_heuristic: true       # 调用失败/未配置时回退本地规则

# ── 本地图文识别模型（CNN / GNN / Transformer / 朴素贝叶斯）──
# 由 `python scripts/train_multimodal.py` 训练，产物落在本段 model_dir。
# 判定链：JEV（需 Key）→ 本地模型（离线，毫秒级）→ 本地正则（兜底）。
# 产物不存在时中间那级自动跳过，不会报错；torch 未安装时只训朴素贝叶斯。
multimodal:
  enabled: true
  model_dir: "data/models/multimodal"
  # 训练超参（脚本默认值，命令行 --epochs 等可覆盖）
  text_per_class: 150        # 每类合成文本条数（7 类 × 150）
  image_per_class: 80        # 每类合成图片张数（4 类 × 80）
  epochs: 12                 # Transformer / CNN 训练轮数
  gcn_epochs: 200            # GCN 全批量训练，收敛更慢，单独给轮数
  seed: 7

# ── 本地对话能力模型（意图头 + 跟进头，词袋朴素贝叶斯）──
# 由 `python scripts/train_dialogue.py` 训练，产物落在本段 model_dir。
# 判定链：LLM 语义分类 → 本地模型（离线，毫秒级）→ 本地正则（兜底）。
# 产物不存在时中间那级自动跳过。零依赖（只用 numpy），torch 缺失也能训。
dialogue:
  enabled: true
  model_dir: "data/models/dialogue"
  per_template: 40           # 合成语料：每条模板生成的样本数
  seed: 20260926             # 语料随机种子（固定 → 结果可复现）

# Kronos 金融时序预测基础模型 (morrisluo/kronos, HuggingFace: NeoQuasar/Kronos-*)
# 该模型为 decoder-only 的 K 线序列预测模型, 非聊天 LLM, 因此作为"预测因子"集成:
# 用其未来 OHLCV 预测构造选股因子, 不参与代码生成(代码生成仍由上面的 LLM 负责)。
kronos:
  enabled: true             # 置 true 时, 选股流水线会调用 Kronos 预测因子(真实模型)
  model_name: NeoQuasar/Kronos-mini   # mini(4.1M)/small(20.5M)/base(93.6M), 显存不够用 mini
  tokenizer_name: NeoQuasar/Kronos-Tokenizer-base  # 与模型权重分开托管的 Kronos tokenizer
  device: auto              # auto | cpu | cuda
  horizon: 5                # 预测未来 N 根 K 线
  future_return_window: 5   # 基于未来 N 根 K 线收盘计算的收益目标
  cache_dir: "./models/kronos" # 权重缓存目录
  hf_endpoint: "https://hf-mirror.com"  # HuggingFace 镜像, 国内可直连时改 ""
  # 真实模型不可用(依赖缺失/权重下载失败)时: true=降级 stub 并告警; false=抛错中断
  fallback_to_stub: true

data:
  # ── 免费数据源（推荐优先级从高到低） ──
  # 1. AKShare（主力）: 完全免费，无需注册，覆盖A股行情/财务/新闻/指数/行业
  # 2. Tushare Pro: 注册免费，token 在 https://tushare.pro 注册获取，基础接口够用
  # 3. Baostock: 免费无需注册，适合批量历史数据，更新较慢
  # 4. efinance: 免费，东方财富数据源，轻量快速
  # 数据源开关：legacy（默认，沿用 akshare/sina/tushare 自爬）| neodata（走平台 NeoData 技能，稳定）
  #               | offline（使用仓库内置的本地 parquet 离线数据，不触网）
  #               | hf（离线的期货全市场 L2 五档快照，500ms；详见 src/data/hf_adapter.py）
  # 离线数据源使用：data/offline/ 数据随仓库分发，克隆即用；把本开关置为 offline
  # 即可全流水线离线取数（详见 src/data/offline_adapter.py）。
  source: offline
  neodata:                         # 仅当 source=neodata 时生效
    # 真实网关端点（来自平台 neodata-financial-search 技能 SKILL.md）：单 POST 端点，
    # 请求体为 {"query","channel":"neodata","sub_channel":"workbuddy"}，返回 data.apiData.apiRecall[].content 文本块。
    base_url: "https://copilot.tencent.com/agenttool/v1/neodata"
    token_env: NEODATA_TOKEN       # token 环境变量名；或由平台自动写入 ~/.workbuddy/.neodata_token
    # ⚠️ 能力边界（2026-09-13 实测复核，markdown 表格解析已实现）：
    #   网关真实可用：POST 返回 HTTP 200 / suc=true，content 就是标准 markdown 表格，
    #   src/data/neo_adapter.py 已内置表格解析（_parse_md_tables + 各 _map_*）。
    #   但服务端**单次响应有篇幅上限**（实测 ~1.5–1.7KB，表格恒定 6–11 行），由此划线：
    #     · 可独立取数：≤5 个交易日窗口的日 K（实测 5 日窗口 1154 字符完整无省略，
    #       分块可拼完整时序）；单股财务（利润表/综合财务指标，取最新报告期）。
    #     · 必须回退 legacy：>5 个交易日的日 K（表格中段被省略并插「禁止推断补全」占位行，
    #       行数不随区间增长）；指数成分股（中证800 实测只给前 11 只）；全市场行业映射
    #       （问「申万一级行业列表」返回的是某指数的行业分布且数值全为 --）；新闻（返回空）；
    #       行业+市值（只能逐股查，800 只 = 800 次请求）。
    #   设计原则：**残缺数据一律返回 None 触发回退，绝不硬凑**——把不完整时序或残缺票池
    #   喂给回测会静默失真，比报错更危险。
    #   鉴权：IDE 会话令牌（connect_cloud_service 现签发）可直接调用；有效期约 12 小时，
    #   过期返回 HTTP 401。历史结论「IDE 会话 token 必 401」已不成立，勿再据此判断。
    fallback_to_legacy: true       # 保持 true：长时序/成分股/行业/新闻仍须 legacy，NeoData 无法独撑回测
    # allow_partial：是否接受服务端截断的残缺结果（默认 false）。仅研究性查看时开启；
    # 回测链路务必保持 false，否则票池会从 800 只静默缩到 11 只、时序只剩首尾几根。
    allow_partial: false
    # max_chunk_requests：短窗口分块抓取的总请求预算（1 次请求 ≈ 5 个交易日 × 1 只标的）。
    # 超预算即判定 NeoData 不适用并直接回退 legacy，避免对「数年 × 数百只」的回测区间
    # 打出成千上万次请求（单标的 5 年 ≈ 250 次）。默认 8 ≈ 单标的 2 个月。
    max_chunk_requests: 8
  offline:                          # 仅当 source=offline 时生效（仓库内置本地离线数据，不触网）
    index: "csi800"                 # 指数池名，对应 data/offline/bars_csi800_part*.parquet
    dir: ""                         # 离线数据目录，留空默认 data/offline
    # ── 高频 L2 快照并入离线数据源 ──
    # 原始快照 382MB / 1580 万行，不适合直接进挖掘面板；由
    # `python scripts/hf_offline_build.py` 预先压实为可分发的小表落进 data/offline，
    # 之后 source=offline 也能直接取高频（无需把原始 .pqt 拷进仓库）。
    hf:
      enabled: true
      file: "C:/Users/HP/Desktop/20251208.pqt"        # 原始 L2 快照（仅构建脚本使用）
      orders_file: "C:/Users/HP/Desktop/附件3：20251208_orders.xlsx"
      panel_file: "data/offline/hf_panel_1min.parquet"  # 分钟级横截面面板（Agent 挖掘用）
      daily_file: "data/offline/hf_daily.parquet"       # 合约日频 + 日内高频统计
      orders_parquet: "data/offline/hf_orders.parquet"  # 自身委托流水（成交概率建模）
      meta_file: "data/offline/hf_meta.json"
      agent_mode: false        # true = 对话式挖掘直接吃高频分钟面板（symbol 为期货合约）
      max_contracts: 24        # 面板最多纳入多少个合约（按快照数=活跃度取前 N）
      freq: "1min"             # 面板重采样频率
  uploads:                     # 对话式挖掘的文件上传（图片/文本/PDF/表格）
    dir: "data/uploads"
    index_file: "data/uploads/index.json"
    max_files: 12              # 单次会话最多保留的上传文件数
    max_bytes: 20971520        # 单文件上限（20MB）
    parse_images: true         # 图片：抽取尺寸/主色等结构化描述；装了 OCR 依赖则额外识别文字
    ocr_enabled: false         # 需要 pytesseract + tesseract 本体，未装则自动跳过
    context_max_chars: 24000   # 单份材料进 prompt 的字数预算（界面可调 8k/24k/60k）；
                               # 装不下时按页保留开头+结尾，中间省略多少页会如实写明
  hf:                               # 仅当 source=hf 时生效：期货全市场 L2 五档快照（离线 parquet）
    # ── 用户接入自有高频表（优先于 L2 快照）──
    # 只要表里有「时间 + 标的 + 价格」三列即可（csv/parquet/xlsx），列名中英文都认；
    # 其余数值列自动挂 hf_ 前缀进入面板。留空则用下面的 L2 快照现场构建。
    # 三条路（user_table / L2 快照 / 离线压实产物）都取不到时，Agent 自动回退常规日频工作流。
    user_table: ""
    # 单日全市场快照约 1580 万行 / 795 合约 / 82 品种，勿整份读进内存（loader 已做谓词下推）
    file: "C:/Users/HP/Desktop/20251208.pqt"
    cache_dir: "data/hf/cache"      # 按合约切片的二级缓存，二次读取秒开
    orders_file: "C:/Users/HP/Desktop/附件3：20251208_orders.xlsx"  # 自身委托流水（成交概率建模）
    search_dirs:                    # file 留空时按此顺序查找
      - "data/hf"
      - "C:/Users/HP/Desktop"
    glob: "*2025*.pqt"
  primary_source: akshare          # 主力数据源（legacy 模式下的子优先级）：akshare / tushare / ths / sina
  # prefer_sina：部分网络下东方财富(push2his)的 HTTPS 连接会被对端重置
  # (RemoteDisconnected)，但新浪源可正常访问。置 true（或把 primary_source 改为 sina）
  # 可让新浪成为首选数据源，跳过东方财富的无谓失败与日志噪音。
  prefer_sina: true
  tushare_token: "${TUSHARE_TOKEN}"  # 可用环境变量 TUSHARE_TOKEN 覆盖
  # ── Tushare 网关（可选） ──
  # 留空：走官方 SDK（api.tushare.pro）与官方 token。
  # 填写：走第三方 Tushare 中转网关，请求为 GET {base_url}/{接口名}?参数，
  #       鉴权头 X-API-Key（填该网关签发的 key，与官方 token 不通用），
  #       返回体仍是官方的 {code,msg,data:{fields,items}} 结构。
  # base_url 失败时自动改用 fallback_url（主备双网关）。
  # ⚠️ 中转网关为第三方服务：key 与全部查询条件都会经过对方服务器，
  #    仅用于本机/研究场景；生产环境请用官方 token 并清空这两项。
  tushare_base_url: "https://pcd.mobcvb.cn/tushare/pro"
  tushare_fallback_url: "http://datahubco.com/app-api/openapi/v1/tushare"

  # ── 同花顺 iFinD MCP 网关数据源（可选） ──
  # token 为 JWE 鉴权令牌（RSA-OAEP-256+A256GCM），仅作 Bearer 令牌向网关鉴权，
  # 客户端无法解密其明文。环境变量 THS_API_TOKEN 优先级高于本配置。
  # base_url 为网关 MCP 端点（实测可用：api-mcp.51ifind.com:8643 的 stock 域）。
  # 同花顺有 4 个域端点：stock / fund / edb / news，因子回测用 stock 域。
  ths_api_token: "${THS_API_TOKEN}"
  ths_api_base_url: "https://api-mcp.51ifind.com:8643/ds-mcp-servers/hexin-ifind-ds-stock-mcp"
  # iFinD MCP 无「指数成分股」专用工具，故直接用配置的小宇宙（可自由增删）。
  # 若留空，则尝试用 search_stocks 自然语言查询 default_index 的成分股（不保证完整）。
  ths_symbols:
    - "600519.SH"   # 贵州茅台
    - "000858.SZ"   # 五粮液
    - "601318.SH"   # 中国平安
    - "600036.SH"   # 招商银行
    - "000333.SZ"   # 美的集团
    - "601899.SH"   # 紫金矿业
    - "600276.SH"   # 恒瑞医药
    - "000001.SZ"   # 平安银行
  default_index: "000906"          # 中证800
  default_start_date: "2020-01-01"
  default_end_date: "2024-12-31"
  # 请求频率控制（避免被封IP）
  # request_interval 此前无任何代码读取（配置是死的），现已由 _RateLimiter 实现：
  # 并发抓取时同样生效——每个请求都先取许可，不会被并发绕过。
  request_interval: 0.5            # 全局最小请求间隔（秒）；0 = 不限流
  # 批量取数并发度：1 = 串行（默认，保持历史行为）。调到 2~4 可显著缩短数百只标的的
  # 取数耗时；注意过快仍可能被行情源限流，建议配合 request_interval 一起调。
  max_concurrency: 1
  # cache_read_first：正常路径也先查本地缓存，命中即返回（此前缓存只在「实时源全失败」
  # 时才被读取，每次跑全流程都要重打网络）。开启后区间不变的重复回测可秒级复跑。
  # 需要拿到最新行情时置回 false。
  cache_read_first: false
  # >0 时，缓存文件修改时间超过该小时数即视为未命中；0 = 永不过期。
  cache_ttl_hours: 0
  force_synthetic: false   # true 时跳过网络数据获取，使用可复现合成数据（离线演示/测试用）
  synthetic_on_fail: false  # true 时若所有实时数据源均失败，自动回退到合成数据（避免界面空白）
  # ── 本地缓存（预备数据源，抗网络波动） ──
  cache_dir: "data/cache"   # 行情/指数/行业市值/整矿缓存目录（已被 .gitignore 忽略）
  use_cache: true           # 拉取成功后写缓存；实时源失败/缺失时优先读取缓存
  cache_only: false         # true 时完全离线，仅读取已预备缓存，绝不触网（现场答辩防断网）
  # 说明：行情查询采用多源自动回退链 东方财富 → 新浪 → Tushare → 同花顺(THS) → 合成数据。
  # 部分网络环境下东方财富连接会被重置，此时会自动切换新浪；若仍不可用且
  # synthetic_on_fail=true，则返回模拟数据。指数服务（data/index）同样支持该回退。
  # 建议：赛前运行 `python scripts/prefetch_data.py` 把真实行情/行业/市值缓存到本地，
  # 现场即使断网也可置 data.cache_only=true（或 refinery.cache_only=true）离线跑通。

backtest:
  n_quantiles: 5
  commission: 0.001  # 手续费率
  risk_free_rate: 0.03
  output_dir: "output"        # 标准化回测图（PNG）输出目录
  save_charts: true           # 评价通过后自动生成并保存回测图

engine:
  sandbox:
    subprocess: true     # true=在独立子进程中执行因子代码（加超时/隔离，防死循环卡死界面）
    timeout: 30          # 因子执行超时（秒），超时即终止
    memory_limit_mb: 0   # 0=不限制（Windows 暂不支持硬内存上限，靠 timeout 兜底）

rag:
  chroma_persist_dir: "./chroma_db"
  embedding_model: "BAAI/bge-small-zh-v1.5"
  top_k: 5
  # ── HuggingFace 下载配置（解决 BGE 向量模型下载超时 WinError 10060）──
  # 国内网络访问 huggingface.co 常被阻断，改用 hf-mirror.com 镜像即可正常下载。
  # 留空字符串 "" 则使用官方直连（海外/可直连环境）。
  hf_endpoint: "https://hf-mirror.com"
  hf_home: ""               # 可选：指定模型缓存目录（如 data/models）；留空则用默认 ~/.cache/huggingface
  hf_hub_timeout: 60        # 单次下载超时（秒），默认 60，网络慢可适当调大
  use_vector_store: true   # 默认自动启用 ChromaDB+BGE 向量检索：依赖（chromadb +
                           # sentence-transformers）就绪时首次使用会自动下载向量模型，
                           # 无需手动编辑本文件；设为 false 可强制关闭、改为离线 jieba 检索
  learned_library_path: "data/learned_factors.jsonl"  # 已学习因子库（外部导入 + 自学习）

agent:
  max_iterations: 6        # 因子生成-反思最大轮数（达标或达上限后终局）
  metrics_threshold: 0.02  # |IC| 达到该阈值视为因子有效，提前结束反思循环
  oos:                     # 单因子 Agent 样本外验证：防「看着答案改作业」过拟合
    enabled: true
    test_frac: 0.2         # 末尾 20% 交易日作为独立样本外（OOS）测试集，不参与生成-反思迭代
    min_test_days: 60      # 测试集最少交易日，低于此值则不切分（数据量不足时）

# ============ 用户输入意图分类（src/agent/intent.py） ============
# 对话入口此前是单意图的：任何输入（含「你好」）都会直接启动因子挖掘流水线，
# LLM 连不上时还有关键词模板兜底，于是用户总能拿到一份「看起来正常」的因子报告。
# 本段把「要不要启动流水线」前置成一次 LLM 语义分类：mining 才跑挖掘图，
# qa / chitchat / clarify 直接对话作答。置 enabled: false 可一键回到旧行为。
intent:
  enabled: true            # false = 全部输入都按因子需求处理（旧行为）
  min_confidence: 0.5      # 低于此值视为「没把握」，界面如实提示用户
  history_turns: 3         # 带进分类 prompt 的最近对话轮数（消解「换个窗口」这类指代）
  temperature: 0.0         # 分类要稳定，不要采样
  fast_path_greeting: true # 纯问候直接规则判定，省一次 LLM 往返
  timeout: 30.0            # 分类调用的超时（秒）
  # 问答时先检索本地因子知识库（rag）再交给模型作答：让「平台怎么用、指标怎么算」
  # 这类问题答的是仓库里的资料，而不是模型泛泛而谈。检索失败不影响作答。
  rag_enabled: true
  rag_top_k: 3             # 注入 prompt 的参考条数
  rag_max_chars: 1200      # 参考文本总长上限（防止挤掉系统契约）

# ============ 多轮上下文（src/agent/context.py） ============
# 挖掘流水线此前是无状态的：run(user_input) 只拿到当前这句，上一轮的因子代码与
# 指标一概不知，于是「换个窗口再跑」只能从零重挖。这里控制带多少轮上下文进入
# 生成节点。设置过大只会挤占因子知识与生成契约，得不偿失。
context:
  turns: 3                 # 带进挖掘 prompt 的最近对话轮数（一轮 = 用户 + 助手）
  max_chars_per_msg: 400   # 单条消息的字符上限（超出截断）

# ============ 因子精炼厂（六阶段冶炼流水线） ============
# 以工业冶炼为隐喻：数据底座 → 三维生成 → RPN 评估 → 三级筛选 → AlphaPool 合成 → 方法学总结
refinery:
  offline: true            # 离线演示：跳过 LLM 矿场（无需 API/网络）；置 false 接入 LLM 矿场
  use_real_data: true      # true 时 PART-01 矿石改用真实行情（需网络/akshare）；失败自动回退缓存/合成
  cache_dir: "data/cache"  # 整矿缓存目录（与 data.cache_dir 一致），网络波动时回退
  cache_only: false        # true 时仅读取已预备整矿缓存，绝不触网（现场答辩防断网）
  multimodal: false        # true 时真实数据矿石纳入基本面/估值/资金流/新闻情绪多模态因子（需 akshare）
  run_portfolio: true      # true 时执行 P0 组合级回测 + 过拟合检验 + 因子动物园（交付证据）
  deep_analysis: true      # true 时出因子后自动跑深度分析：统计体检 + 12 张图表 + 大模型解读
  deep_analysis_dir: "output/factor_report"   # 图表与 Markdown 报告输出目录
  deep_analysis_system: true    # 额外跑多因子体系（线性 max-IC / 显式非线性 / 树 / contextual）
  deep_analysis_max_factors: 12 # 参与体系搭建的入选因子上限（控制树模型与贪心搜索开销）
  n_symbols: 200           # 中证1000 子集规模（演示）
  train_days: 500          # 训练集 2019-2023
  test_days: 120           # 测试集 2024 全年（独立，仅用于最终报告）
  start: "2019-01-01"
  n_workers: 4             # 多进程并行：特征构建/批量求值加速（34min → ~1min）
  seed: 42
  output_dir: output
  transformer:             # 研磨车间 × 向量化表征
    d_model: 128
    nhead: 5
    num_layers: 2
  rl_max_len: 5            # MaskablePPO 因子组合搜索：组合上限
  rl_candidates: 6
  rl_backend: auto         # auto | sb3 | heuristic；auto 在装了 sb3_contrib 时启用真 MaskablePPO
  n_pool_seed: 12          # 因子池基础候选取样数
  max_llm_factors: 1
  screener:                # PART-04 三级筛选（浮选）
    use_lasso: true        # 第一级：LASSO 去冗余
    use_human_collab: true # 第二级：人机协同（Partice 平台）
    topk_ratio: 0.1        # 第三级：TOP 10% 截断
    min_keep: 3
  alpha_pool:              # PART-05 合金配比
    ortho: true            # 正交化去冗余
    loo: true              # leave-one-out 过拟合检验
    iterative: true        # 迭代权重优化
    n_iter: 20
  rpn:                     # PART-03 研磨车间（RPN 求值引擎）
    n_quantiles: 5
    forward_periods: 1
    commission: 0.001
    risk_free_rate: 0.03
    w_turnover_penalty: 0.2  # 目标函数：最大化 Alpha(ICIR) - 惩罚换手
    parallel: true
    n_workers: 4

# ============ 网络代理（访问行情源 / 远程 LLM 端点） ============
# 默认（enabled: false 且未设环境变量）强制直连，规避 Windows 不可达系统代理
# 导致的 ProxyError（东方财富/新浪等行情源此前即因此报错）。
# 当你有「可达的代理」时，任选一种方式启用即可（两者都会自动生效）：
#   A. 配置文件方式（推荐，改这里）：把 enabled 改为 true 并填写 http/https 地址。
#      常见本地代理：Clash  http://127.0.0.1:7890；v2rayN  http://127.0.0.1:10809
#      （SOCKS5 也可，但 requests/akshare 对 socks 需 pip install pysocks）。
#   B. 环境变量方式：在启动前设置 HTTP_PROXY / HTTPS_PROXY（见下方说明），
#      本配置 enabled 保持 false 也会自动尊重该环境变量。
# 无论哪种方式，localhost / 127.0.0.1 始终直连，本地 Ollama 不受影响。
proxy:
  enabled: false
  http: ""          # HTTP 代理地址，如 http://127.0.0.1:7890
  https: ""         # HTTPS 代理地址，留空则复用 http
  no_proxy: "localhost,127.0.0.1"  # 始终直连的地址（无需修改）

# ============ 实验追踪与因子版本管理（可审计 / 可复现） ============
# 记录每次因子评估（因子代码 + 指标 + git commit），直接回应「为什么信这个因子」。
# backend: local（默认，零依赖，JSONL 落盘）| mlflow（需 pip install mlflow，额外推到 MLflow UI）
experiment_tracking:
  backend: local
  dir: "data/experiments"
  experiment_name: factorgpt

# ============ Headline Arena 前瞻检验（forward testing） ============
# 因子验证（IC 历史检验）回答不了「这个观点向前看还成立吗」。本段把因子层的
# 宏观观点（利率/风格/商品方向）转成每日概率预测提交到 Headline Arena
# （https://headlinearena.com/api/v1/agent/onboarding/guide.txt），预测在结果出现
# 之前锁定、结算标准在出题时冻结、由第三方机械结算（方向 50±50c，宏观 CRPS），
# 得到一条与回测相互独立、最难反驳的 forward 证据线。
#
# - enabled: true 时，LangGraph 因子 Agent 在产出因子后自动追加「影子前瞻节点」：
#   从因子描述折叠宏观主题 -> 本地账本 dry_run 锁定（绝不因 Agent 运行而真实提交）；
#   默认 false，不影响既有流水线拓扑。
# - dry_run: 默认 true（只写 data/forwardtest/ledger.jsonl，预测在本地锁定）。
#   真实提交请显式执行: python scripts/ha_forward_run.py run --live --theme "..."
# - 凭据: .env 的 HA_AGENT_ID / HA_CLIENT_SECRET（register 子命令自动写入
#   ~/.headlinearena/credentials.json；认领 claim 为人工步骤）。
headline_arena:
  enabled: false              # true=因子 Agent 产出后挂影子前瞻节点（dry_run 账本）
  dry_run: true               # 默认只写本地账本；真实提交需脚本显式 --live
  base_url: ""                # 留空取 HA_BASE_URL 环境变量或官方默认 https://headlinearena.com/api/v1
  assets: ["GC", "ES", "CL", "ZN", "SI", "HG", "DXY"]  # 关注的宏观资产子集
  default_theme: ""           # 每日循环默认宏观主题（留空按因子描述推导）
  ledger_dir: ""              # 留空 -> data/forwardtest/
  auto_subscribe: true        # live 提交前自动订阅资产 scope（幂等）
  neutral_when_no_signal: false  # 无方向信号时补中性占位（默认不制造噪声）
  max_challenges_per_asset: 1    # 每资产每轮最多锁定的挑战数
