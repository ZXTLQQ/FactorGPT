[pytest]
testpaths = tests

# 告警即失败。
#
# 本项目的核心风险不是"报错"，而是"静默地把异常状态当成正常值"——典型如
# ``np.corrcoef`` 在全常数截面上抛 ``invalid value encountered in divide``
# 后被吞成 0，看起来像个正常的相关性；以及 ``np.nanmean`` 在空切片上告警后
# 返回 NaN，掩盖了"这天根本没数据"。把 RuntimeWarning / FutureWarning /
# DeprecationWarning 一律升级为错误，等于让这类问题在 CI 里显式暴露，而不是
# 靠人肉 review 去发现。
#
# 如果确实遇到第三方库引入的、与本仓库无关的告警，请**精确**加白名单，
# 例如：ignore:Some exact message:DeprecationWarning:thirdparty\.module
# 不要用 ``ignore::DeprecationWarning`` 一刀切，那会把闸门彻底关掉。
filterwarnings =
    error
    # torch 的 TransformerEncoder 一旦传 src_key_padding_mask 就会走 nested tensor
    # 原型路径并发 UserWarning（PyTorch 2.x 自身行为，与本仓库无关）。按仓库约定
    # **精确**加白名单，不用 ignore::UserWarning 一刀切。
    ignore:The PyTorch API of nested tensors is in prototype stage:UserWarning
    # jieba 0.42.1 的 _compat.py 是 ``try: import pkg_resources / except ImportError:``
    # ——装了 setuptools 就走 pkg_resources，而后者在 import 时就发这个告警。于是
    # CI 的 Python 3.11 腿（runner 自带 setuptools）挂、3.12 腿（不带）过：本仓库
    # 一行代码都没差。告警出自第三方且在 import 期发出，无法在源码侧消除，且
    # 只会在本进程第一次 import jieba 的那条用例上炸——表现为"随机一条用例红"。
    # 按仓库约定精确加白名单。
    ignore:pkg_resources is deprecated as an API:DeprecationWarning
